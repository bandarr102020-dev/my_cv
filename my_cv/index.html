<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السيرة الذاتية - بندر فريح الشمري</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="top-bar">
            <h1>السيرة الذاتية (CV)</h1>
            <button id="theme-btn">الوضع الليلي 🌙</button>
        </header>

        <section id="info-section" class="card">
            <h2>المعلومات الشخصية</h2>
            <div id="info-list"></div>
        </section>

        <section id="skills-section" class="card">
            <h2>المهارات التقنية</h2>
            <div id="skills-list" class="grid-list"></div>
        </section>

        <section id="projects-section" class="card">
            <h2>المشاريع والخبرات</h2>
            <div id="projects-list"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
